name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WinPulseStudio.slnx

      - name: Build
        run: dotnet build WinPulseStudio.slnx -c Release --no-restore

      - name: Test
        run: dotnet test WinPulseStudio.slnx -c Release --no-build --verbosity normal

      - name: Validate all scripts
        shell: pwsh
        run: pwsh -NoProfile -File tests/Validate-AllScripts.ps1

      - name: Publish single-file exe
        shell: pwsh
        run: pwsh -NoProfile -File Build-SingleExe.ps1 -SkipSigning

      - name: Build MSIX layout
        shell: pwsh
        run: pwsh -NoProfile -File Build-MSIX.ps1 -SkipSigning